spring.application.name=backend
server.port=8081

# ===============================
# Base de datos MySQL
# Los valores se pueden cambiar con variables de entorno (DB_URL, DB_USERNAME, DB_PASSWORD)
# para no subir la contraseña real al repositorio público.
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/GeekManga?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:contraseña}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# jwt.secret: clave en Base64 (mínimo 256 bits). En producción se define con la variable JWT_SECRET.
# jwt.expiration-ms: duración del access token (1 hora).
# jwt.refresh-expiration-ms: duración del refresh token (7 días).
# ===============================
jwt.secret=${JWT_SECRET:xbczb7Y9/KK6oCxHN1JmewroT7eB0TzocGGbLoBYK9Nm+YQ6lQk+ZTzQYKAp5BR/OqXSn2FWXMawHvY1/Cde7g==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===============================
# CORS: orígenes del frontend que pueden llamar a la API (separados por coma)
# ===============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===============================
# Swagger: http://localhost:8081/swagger-ui.html
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
